<!doctype html>
<html lang="en" data-m3-primary="#d9502f">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pesu Phrase Lessons</title>
<meta name="description" content="Learn real-life phrases through illustrated scenes, audio, speaking and a Super Memory review loop.">
<meta name="theme-color" content="#FBF6EE">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://tgopinath.github.io/kolam-design-system/m3/kolam-m3.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE;--surface:#FFFFFF;--surface-2:#F4EDE1;--ink:#1E2230;--muted:#6B6F7B;--line:#E8DFD0;
  --accent:#FF6B4A;--accent-deep:#D9502F;--accent-soft:#FFE6DE;--accent-ink:#fff;
  --ok:#159A7E;--ok-deep:#0E7B64;--ok-soft:#DDF5EC;--bad:#D9434B;--bad-deep:#B3333A;--bad-soft:#FDE4E4;
  --gold:#F5B82E;--shadow:0 1px 0 rgba(30,34,48,.05),0 10px 30px -16px rgba(30,34,48,.25);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161D;--surface:#1D2029;--surface-2:#252935;--ink:#F2EEE7;--muted:#9EA3AF;--line:#323745;
  --accent:#FF7A5C;--accent-deep:#C9512F;--accent-soft:#3A2420;--ok:#3CC59F;--ok-deep:#24997A;--ok-soft:#15322A;
  --bad:#F06A70;--bad-deep:#B8444A;--bad-soft:#3A1C1F;--shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#14161D;--surface:#1D2029;--surface-2:#252935;--ink:#F2EEE7;--muted:#9EA3AF;--line:#323745;
  --accent:#FF7A5C;--accent-deep:#C9512F;--accent-soft:#3A2420;--ok:#3CC59F;--ok-deep:#24997A;--ok-soft:#15322A;
  --bad:#F06A70;--bad-deep:#B8444A;--bad-soft:#3A1C1F;--shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:600px;margin:0 auto;padding:0 16px 140px;min-height:100dvh}
.h-display{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:26px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-style:normal;font-size:16px;color:#fff;transform:rotate(-6deg)}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.pill.flag{font-size:20px;padding:0 10px}
.ring{width:38px;height:38px;position:relative;display:grid;place-items:center;font-size:11px;font-weight:800}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}

/* home */
.hero{padding:18px 0 6px}
.hero h1{font-size:clamp(28px,7vw,38px);line-height:1.08;margin:0 0 8px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.step{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 12px}
.step b{display:block;font-size:13px;margin-top:4px}
.step span{font-size:12px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.step .n{font-size:20px}
.memory{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:linear-gradient(135deg,var(--accent) 0%,#FF9A5C 100%);color:#fff;box-shadow:var(--shadow);margin-bottom:22px}
.memory.calm{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.memory .big{font-size:34px;line-height:1}
.memory h3{margin:0;font-size:17px}
.memory p{margin:2px 0 0;font-size:14px;opacity:.9}
.memory.calm p{color:var(--muted);opacity:1}
.memory .go{margin-left:auto;background:#fff;color:var(--accent-deep);font-weight:800;padding:10px 14px;border-radius:12px;white-space:nowrap}
.memory.calm .go{background:var(--surface-2);color:var(--ink)}
.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.theme{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:var(--r);padding:14px;transition:transform .12s}
.theme:hover{transform:translateY(-2px)}
.theme:active{transform:translateY(1px)}
.blob{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;margin-bottom:10px}
.theme h4{margin:0;font-size:16px}
.theme small{color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0 0 16px}

/* onboarding */
.langs{display:grid;gap:10px;margin-top:20px}
.lang{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:var(--r)}
.lang .f{font-size:32px}
.lang b{display:block;font-size:17px}
.lang span{color:var(--muted);font-size:14px}
.lang.on{border-color:var(--accent);background:var(--accent-soft)}

/* session */
.sbar{display:flex;align-items:center;gap:12px;padding:16px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.x{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.prog{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.phase{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:22px 20px;box-shadow:var(--shadow);text-align:center}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.scene{width:150px;height:150px;margin:4px auto 16px;border-radius:44px;display:grid;place-items:center;font-size:84px;position:relative}
.scene span{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.count{font-size:13px;font-weight:700;color:var(--muted)}
.phrase{font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.2;margin:6px 0 4px}
.translit{color:var(--accent-deep);font-weight:600;font-size:16px}
:root[data-theme="dark"] .translit{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .translit{color:var(--accent)}}
.meaning{color:var(--muted);font-size:16px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0 4px}
.chip{padding:6px 10px;border-radius:10px;background:var(--surface-2);font-weight:600;font-size:15px}
.chip:hover{background:var(--accent-soft)}
.chip.playing{background:var(--accent);color:#fff}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.round{display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;background:var(--surface-2);font-weight:700}
.round.main{background:var(--accent);color:#fff;box-shadow:inset 0 -4px 0 var(--accent-deep)}
.round.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}
.speakres{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.speakres b{font-size:16px}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:all .2s}
.dots i.on{width:22px;background:var(--accent)}
.dots i.seen{background:var(--ok)}

.prompt{font-family:Fraunces,serif;font-weight:700;font-size:24px;margin:10px 0 16px}
.ask{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:16px}
.ask .e{font-size:48px;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;flex:none}
.ask b{font-size:19px}
.bigplay{display:flex;gap:12px;justify-content:center;margin:6px 0 22px}
.bigplay button{width:88px;height:88px;border-radius:26px;background:var(--accent);color:#fff;font-size:34px;box-shadow:inset 0 -6px 0 var(--accent-deep)}
.bigplay button.slow{width:64px;height:64px;align-self:flex-end;font-size:24px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:inset 0 -4px 0 var(--line)}
.opts{display:grid;gap:10px}
.opts.pics{grid-template-columns:1fr 1fr}
.opt{position:relative;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;text-align:left;font-weight:700;font-size:17px;transition:transform .08s;display:flex;align-items:center;gap:12px}
.opt:active{transform:translateY(2px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.opts.pics .opt{flex-direction:column;justify-content:center;padding:18px 10px;font-size:58px;min-height:130px}
.opts.pics .opt .k{position:absolute;top:8px;left:8px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.badx{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.45}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px;margin-bottom:18px;align-content:flex-start}
.answer:empty::before{content:'Tap the words in order';color:var(--muted);font-size:15px;align-self:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:10px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;font-weight:700;font-size:17px}
.enter{animation:pop .25s ease}
.tile.used{visibility:hidden}
.typein{width:100%;font:inherit;font-size:20px;font-weight:600;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.typein:focus{border-color:var(--accent)}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.accents button{min-width:38px;height:38px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-weight:700}

.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match .col{display:grid;gap:10px}
.mt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;min-height:66px;padding:10px 12px;font-weight:700;font-size:16px;display:grid;place-items:center;text-align:center;transition:all .15s}
.mt.emo{font-size:34px}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{border-color:var(--ok);background:var(--ok-soft);opacity:.55;pointer-events:none}
.mt.badx{border-color:var(--bad);background:var(--bad-soft)}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:10}
.foot .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot.good{background:var(--ok-soft);border-color:transparent}
.foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{flex:1;min-width:0}
.fb h3{margin:0;font-size:19px;display:flex;align-items:center;gap:8px}
.foot.good h3{color:var(--ok)}
.foot.bad h3{color:var(--bad)}
.fb p{margin:2px 0 0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.fb p small{font-weight:500;color:var(--muted)}
.btn{height:52px;padding:0 24px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.02em;background:var(--accent);color:#fff;box-shadow:inset 0 -5px 0 var(--accent-deep);white-space:nowrap}
.btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 -5px 0 var(--line);cursor:default}
.btn.ok{background:var(--ok);box-shadow:inset 0 -5px 0 var(--ok-deep)}
.btn.bad{background:var(--bad);box-shadow:inset 0 -5px 0 var(--bad-deep)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line)}
.btn.wide{flex:1}
.ear{width:44px;height:44px;border-radius:12px;background:var(--surface);flex:none;font-size:20px}

/* results */
.result{text-align:center;padding-top:30px}
.result .trophy{font-size:80px;animation:bob 2.4s ease-in-out infinite}
.result h2{font-size:34px;margin:8px 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{border-radius:16px;border:2px solid var(--line);overflow:hidden;background:var(--surface)}
.stat .l{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:6px;color:#fff}
.stat .v{font-size:24px;font-weight:800;padding:12px 6px}
.missed{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
.missed h4{margin:0 0 8px;font-size:15px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mrow .e{font-size:24px}
.mrow b{display:block}
.mrow span{font-size:13px;color:var(--muted)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:600px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h3{margin:0 0 4px;font-size:22px}
@media (hover:none){.keys{display:none}}
kbd{font:inherit;font-size:11px;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
@media (max-width:420px){.method .step span:not(.n){display:none}.opts.pics .opt{font-size:48px;min-height:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="https://tgopinath.github.io/kolam-design-system/m3/kolam-m3.css">
<style>
/* ---------- Android app mode (Material Design 3, from the shared Kolam M3 kit) ----------
   Only html.k-android (inside the Android app) is touched; the website keeps its own look. The kit builds the
   app bar and navigation bar; here Pesu's colours point at the M3 roles and its components get M3 shapes. */
html.k-android{--md-ref-typeface-brand:Figtree,system-ui,sans-serif;--md-ref-typeface-plain:Figtree,system-ui,sans-serif;
  --accent:var(--md-sys-color-primary);--accent-deep:var(--md-sys-color-primary);--accent-soft:var(--md-sys-color-primary-container);--accent-ink:var(--md-sys-color-on-primary);
  --surface-2:var(--md-sys-color-surface-container-highest);--muted:var(--md-sys-color-on-surface-variant);--r:var(--md-sys-shape-corner-medium);--shadow:var(--md-sys-elevation-level1)}
html.k-android #app{padding:8px 16px 32px;min-height:0}
html.k-android .top,html.k-android .sbar .x{display:none}
html.k-android .sbar{position:static;padding:8px 0 12px;background:transparent}
html.k-android.pesu-full .md-navigation-bar{display:none}
html.k-android.pesu-full body{padding-bottom:calc(96px + var(--md-inset-bottom))}
html.k-android .hero{padding:8px 0 4px}
html.k-android .hero h1{font:var(--md-sys-typescale-headline-medium);font-family:Fraunces,Georgia,serif;font-weight:700}
html.k-android .btn{height:40px;border-radius:var(--md-sys-shape-corner-full);box-shadow:none;font:var(--md-sys-typescale-label-large);font-weight:700;padding:0 24px;background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
html.k-android .btn:disabled{background:color-mix(in srgb,var(--md-sys-color-on-surface) 12%,transparent);color:color-mix(in srgb,var(--md-sys-color-on-surface) 38%,transparent);box-shadow:none}
html.k-android .btn.ok{background:var(--ok);color:#fff;box-shadow:none}
html.k-android .btn.bad{background:var(--bad);color:#fff;box-shadow:none}
html.k-android .btn.ghost{background:transparent;color:var(--md-sys-color-primary);border:1px solid var(--md-sys-color-outline)}
html.k-android .foot{background:var(--md-sys-color-surface-container);border-top:0;padding-bottom:calc(14px + var(--md-inset-bottom))}
html.k-android .theme,html.k-android .lang,html.k-android .step{border:0;border-bottom-width:0;background:var(--md-sys-color-surface-container-low);box-shadow:var(--md-sys-elevation-level1);border-radius:var(--md-sys-shape-corner-medium)}
html.k-android .lang.on{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);box-shadow:none}
html.k-android .memory{border-radius:var(--md-sys-shape-corner-large);background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);box-shadow:none;border:0}
html.k-android .memory.calm{background:var(--md-sys-color-surface-container-high);color:var(--md-sys-color-on-surface)}
html.k-android .memory .go{border-radius:var(--md-sys-shape-corner-full);background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
html.k-android .card{border:0;border-radius:var(--md-sys-shape-corner-extra-large);background:var(--md-sys-color-surface-container-low);box-shadow:var(--md-sys-elevation-level1)}
html.k-android .chip{height:32px;padding:0 12px;border-radius:var(--md-sys-shape-corner-small);background:transparent;box-shadow:inset 0 0 0 1px var(--md-sys-color-outline)}
html.k-android .round{border-radius:var(--md-sys-shape-corner-full)}
html.k-android .section-title{font:var(--md-sys-typescale-title-small);text-transform:none;letter-spacing:0;color:var(--md-sys-color-on-surface-variant)}
html.k-android .prog{height:4px;background:var(--md-sys-color-secondary-container)}
html.k-android .prog i{background:var(--md-sys-color-primary);box-shadow:none}
/* Review page (app only) */
.mstats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 20px}
.mstat{background:var(--md-sys-color-surface-container-low,var(--surface));border-radius:var(--md-sys-shape-corner-medium,16px);padding:16px}
.mstat b{display:block;font-size:28px;line-height:36px}
.mstat span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="foot"></div>
<div id="layer"></div>
<script>
/* ---------- Content ---------- */
const LANGS = {

    const notes = {good:[523,659,784],bad:[300,220],tap:[880],done:[523,659,784,1047]}[kind];

      const t=actx.currentTime+i*(kind==='tap'?0:.09);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='tap'?.05:.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.25)});
  }catch(e){}
}

/* ---------- SRS + progress ---------- */
const dueItems = () => Object.entries(srs()).filter(([,v])=>v.due<=Date.now()).map(([k])=>ITEM[k]).filter(Boolean);
const learned = t => t.items.filter(i=>srs()[i.id]).length;
const mastered = t => t.items.filter(i=>(srs()[i.id]?.box||0)>=3).length;
function grade(id, ok){
  const r = srs()[id] || {box:0,due:0};
  r.box = ok ? Math.min(r.box+1,5) : 0;
  r.due = Date.now() + INTERVALS[r.box];
  srs()[id] = r;
}
function addXP(n){S.xp+=n;S.today.xp+=n}
function bumpStreak(){
  const t=dayStr(), y=dayStr(new Date(Date.now()-864e5));
  if(S.lastDay===t) return; S.streak = S.lastDay===y ? S.streak+1 : 1; S.lastDay=t;
}

/* ---------- Exercises ---------- */
function typesFor(it){
  const t=['picture','phrase'];
  if(toks(it).length>=3) t.push('build','build');
  if(L().latin && toks(it).length<=5) t.push('type');
  return t;
}
function makeEx(it, type){
  const pool = themeOf(it.theme).items;
  const others = pool.filter(p=>p.id!==it.id && txt(p)!==txt(it) && p.e!==it.e);
  type ||= sample(typesFor(it),1)[0];
  const ex = {type, item:it, sel:null, state:'ask'};
  if(type==='picture'||type==='phrase') ex.opts = shuffle([it,...sample(others,3)]);
  if(type==='build'){
    const mine = toks(it), lower = new Set(mine.map(w=>w.toLowerCase()));
    const extra = [...new Set(others.flatMap(toks))].filter(w=>!lower.has(w.toLowerCase()));
    ex.bank = shuffle([...mine, ...sample(extra, Math.min(3, Math.max(2, 6-mine.length)))]).map((t,k)=>({t,k}));
    ex.ans = [];
  }
  if(type==='type') ex.val='';
  return ex;
}
function makeMatch(items){
  const set = sample(items,4);
  return {type:'match', item:null, set, left:shuffle(set), right:shuffle(set), done:new Set(), pick:null, miss:0, state:'ask'};
}

/* ---------- Session ---------- */
let view = {name: S.lang ? 'home' : 'onboard'};
function startLesson(themeId){
  const t = themeOf(themeId);
  view = {name:'session', mode:'lesson', theme:t, items:t.items, phase:'learn', li:0, seen:new Set([0]), q:[], qi:0, first:{}, xp:0};
  render(); setTimeout(()=>say(txt(t.items[0])),250);
}
function startReview(){
  let items = dueItems();
  if(!items.length) items = Object.entries(srs()).sort((a,b)=>a[1].box-b[1].box).slice(0,8).map(([k])=>ITEM[k]).filter(Boolean);
  items = sample(items, Math.min(12, items.length));
  if(!items.length) return;
  view = {name:'session', mode:'review', theme:null, items, phase:'practice', q:[], qi:0, first:{}, xp:0};
  buildQueue(); render(); autoAudio();
}
function buildQueue(){
  const v=view, its=shuffle(v.items);
  const q = its.map((it,i)=>makeEx(it, i%3===0 && toks(it).length>=3 ? 'build' : undefined));
  if(v.mode==='lesson' && its.length>=4) q.splice(3,0,makeMatch(its));
  v.q=q; v.qi=0;
}
const curEx = () => view.q[view.qi];
function autoAudio(){const ex=curEx(); if(ex && (ex.type==='picture'||ex.type==='type')) setTimeout(()=>say(txt(ex.item)),300)}

function check(){
  const ex=curEx(); if(!ex||ex.state!=='ask') return;
  let ok=false, note='';
  if(ex.type==='picture'||ex.type==='phrase') ok = ex.sel===ex.item.id;
  if(ex.type==='build') ok = norm(ex.ans.map(k=>ex.bank[k].t).join(' '),false)===norm(toks(ex.item).join(' '),false);
  if(ex.type==='type'){
    const a=norm(ex.val), b=norm(txt(ex.item));
    if(a===b) ok=true;
    else if(norm(ex.val,false)===norm(txt(ex.item),false)){ok=true;note='Watch the accents'}
    else if(b.length>4 && lev(a,b)<=1){ok=true;note='Almost — check the spelling'}
  }
  resolve(ex, ok, note);
}
function resolve(ex, ok, note=''){
  const v=view, id=ex.item?.id;
  ex.state='done'; ex.ok=ok; ex.note=note;
  if(id){
    if(!(id in v.first)){ v.first[id]=ok; grade(id,ok); const g=ok?10:0; addXP(g); v.xp+=g; }
    else if(ok){ addXP(5); v.xp+=5; }
    if(!ok){ // Super Memory loop: bring it back until it sticks
      const alt = typesFor(ex.item).filter(t=>t!==ex.type);
      v.q.push(makeEx(ex.item, alt.includes('phrase')?'phrase':alt[0]));
    }
  }else if(ok){ addXP(10); v.xp+=10; }
  save(); sfx(ok?'good':'bad');
  if(id) say(txt(ex.item));
  render();
}
function next(){
  const v=view; v.qi++;
  if(v.qi>=v.q.length){ finish(); return; }
  render(); autoAudio();
}
function finish(){
  const v=view; addXP(20); v.xp+=20; bumpStreak();
  if(v.theme){ const acc=score(); S.best[S.lang+':'+v.theme.id]=Math.max(S.best[S.lang+':'+v.theme.id]||0,acc); }
  save(); v.phase='done'; sfx('done'); render(); confetti();
}
const score = () => { const f=Object.values(view.first); return f.length?Math.round(100*f.filter(Boolean).length/f.length):100; };
function quit(){ try{speechSynthesis.cancel()}catch(e){} closeLayer(); if(m3.enabled && location.hash==='#/session'){ history.back(); return; } view={name:'home'}; render(); }

/* ---------- Speaking practice ---------- */
let rec=null, micBlocked=false;
const PASS=.6, MAX_TRIES=3;
// Learn cards wait for the learner to say the phrase back (only where speech recognition works)
const canSpeak = () => !!(SR || NSR);
const mustSay = () => canSpeak() && !micBlocked;
if(NSR) NSR.available().then(r=>{ if(!r.available){ micBlocked=true; render(); } }).catch(()=>{});
const cardPassed = v => !mustSay() || v.said?.has(v.li) || (v.tries?.[v.li]||0) >= MAX_TRIES;
function heard(it, alts){
  alts = alts.filter(Boolean);
  if(!alts.length){ view.speak={state:'err',msg:'Didn\'t catch that — try again.'}; render(); return; }
  const best = alts.map(a=>({a,s:sim(a,txt(it))})).sort((x,y)=>y.s-x.s)[0];
  const v=view; v.speak={state:'res',heard:best.a,pct:Math.round(best.s*100)};
  (v.tries ||= {})[v.li]=(v.tries[v.li]||0)+1;
  if(best.s>=PASS) (v.said ||= new Set()).add(v.li);
  sfx(best.s>=PASS?'good':'bad');
  if(best.s>=.75 && !view.spokeXP?.has(it.id)){ (view.spokeXP ||= new Set()).add(it.id); addXP(5); view.xp+=5; save(); }
  render();
}
async function listenNative(it){
  if(view.speak?.state==='rec'){ NSR.stop().catch(()=>{}); return; }
  try{
    let p = await NSR.checkPermissions();
    if(p.speechRecognition!=='granted') p = await NSR.requestPermissions();
    if(p.speechRecognition!=='granted'){ micBlocked=true; view.speak={state:'err',msg:'Microphone access was blocked, so you can move on without speaking.'}; render(); return; }
    try{ await NATIVE?.stop(); }catch(e){}
    view.speak={state:'rec'}; render();
    const r = await NSR.start({language:L().tts, maxResults:3, popup:false, partialResults:false});
    heard(it, r?.matches||[]);
  }catch(e){ view.speak={state:'err',msg:'Didn\'t catch that — try again.'}; render(); }
}
function listen(it){
  if(NSR) return listenNative(it);
  if(!SR) return;
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang=L().tts; rec.interimResults=false; rec.maxAlternatives=3;
  view.speak={state:'rec'}; render();
  rec.onresult = e => heard(it, [...e.results[0]].map(a=>a.transcript));
  rec.onerror = e => { if(e.error==='not-allowed'||e.error==='service-not-allowed') micBlocked=true; view.speak={state:'err',msg:e.error==='not-allowed'?'Microphone access was blocked, so you can move on without speaking.':'Didn\'t catch that — try again.'} };
  rec.onend = () => { rec=null; if(view.speak?.state==='rec') view.speak={state:'err',msg:'Didn\'t catch that — try again.'}; render(); };
  try{ rec.start(); }catch(e){ rec=null; view.speak=null; render(); }
}

      <div class="stat" style="border-color:var(--gold)"><div class="l" style="background:var(--gold)">XP</div><div class="v">+${v.xp}</div></div>
      <div class="stat" style="border-color:var(--ok)"><div class="l" style="background:var(--ok)">Accuracy</div><div class="v">${acc}%</div></div>
      <div class="stat" style="border-color:var(--accent)"><div class="l" style="background:var(--accent)">Phrases</div><div class="v">${Object.keys(v.first).length}</div></div>
    </div>
    ${missed.length?`<div class="missed"><h4>🧠 Added to Super Memory</h4>${missed.map(m=>`
      <div class="mrow"><span class="e">${m.e}</span><span style="flex:1"><b lang="${S.lang}">${esc(txt(m))}</b><span>${translit(m)?esc(translit(m))+' · ':''}${esc(mean(m))}</span></span><button class="ear" style="background:var(--surface-2)" data-act="sayid" data-k="${m.id}" aria-label="Play">🔊</button></div>`).join('')}</div>`
      : `<div class="missed" style="text-align:center"><h4 style="margin:0">Every phrase right on the first try ✨</h4></div>`}
  </div>`;
  $foot.className='foot';
  $foot.innerHTML=`<div class="in">${v.theme?`<button class="btn ghost" data-act="again">Again</button>`:''}<button class="btn wide" data-act="quit">Continue</button></div>`;
}

/* ---------- Layer (language sheet) ---------- */
function openLangs(){
  $layer.innerHTML=`<div class="scrim" data-act="closelayer"><div class="sheet" data-stop>
    <h3 class="h-display">Switch language</h3><p style="color:var(--muted);margin:0 0 6px">Progress is kept separately for each one.</p>
    <div class="langs" style="margin-top:12px">${Object.entries(LANGS).map(([k,l])=>{const n=Object.keys(S.srs[k]||{}).length;return `
      <button class="lang ${k===S.lang?'on':''}" data-act="pick" data-k="${k}"><span class="f">${l.flag}</span><span><b>${l.name}</b><span>${esc(l.native)} · ${n?`${n} phrases learned`:'Not started'}</span></span></button>`}).join('')}</div></div></div>`;
}
function closeLayer(){$layer.innerHTML=''}

function confetti(){
  const cols=['#FF6B4A','#F5B82E','#159A7E','#7FB8FF','#FF8FB1','#B9A2FF'];
  for(let i=0;i<60;i++){const d=document.createElement('i');d.className='confetti';
    d.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%cols.length]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),3800);}
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='closelayer' && e.target.closest('[data-stop]')) return;
  const k=b.dataset.k, v=view, ex = v.name==='session' && v.phase==='practice' ? curEx() : null;
  switch(b.dataset.act){
    case 'pick': S.lang=k; save(); closeLayer(); view={name:'home'}; if(m3.enabled && location.hash!=='#/' && location.hash!==''){ location.hash='#/'; break; } render(); if(m3.enabled) m3Title(); window.scrollTo(0,0); break;
    case 'langs': openLangs(); break;
    case 'closelayer': closeLayer(); break;
    case 'lesson': startLesson(k); break;
    case 'review': startReview(); break;
    case 'quit': quit(); break;
    case 'again': startLesson(v.theme.id); break;
    case 'play': say(txt(v.phase==='learn'?v.items[v.li]:ex.item)); break;
    case 'slow': say(txt(v.phase==='learn'?v.items[v.li]:ex.item),.55); break;
    case 'replay': say(txt(ex.item)); break;
    case 'sayid': say(txt(ITEM[k])); break;
    case 'word': { say(toks(v.items[v.li])[+k],.8); b.classList.add('playing'); setTimeout(()=>b.classList.remove('playing'),600); break; }
    case 'mic': listen(v.items[v.li]); break;
    case 'prev': if(v.li>0){v.li--;v.speak=null;render();say(txt(v.items[v.li]))} break;
    case 'nextcard': if(!cardPassed(v)) break;
      if(rec) rec.stop(); if(NSR && v.speak?.state==='rec') NSR.stop().catch(()=>{});
      v.speak=null;
      if(v.li<v.items.length-1){ v.li++; v.seen.add(v.li); render(); say(txt(v.items[v.li])); }
      else { v.phase='practice'; buildQueue(); render(); autoAudio(); }
      break;
    case 'sel': if(ex.state!=='ask') break; ex.sel=k; sfx('tap'); if(ex.type==='phrase') say(txt(ITEM[k])); render(); break;
    case 'build': if(ex.state!=='ask'||ex.ans.includes(+k)) break; ex.ans.push(+k); say(ex.bank[+k].t,.9); render(); break;
    case 'unbuild': if(ex.state!=='ask') break; ex.ans.splice(+k,1); render(); break;
    case 'acc': { const i=document.getElementById('typein'); const s=i.selectionStart??i.value.length; i.value=i.value.slice(0,s)+k+i.value.slice(i.selectionEnd??s); ex.val=i.value; i.focus(); i.setSelectionRange(s+1,s+1); syncCheck(); break; }
    case 'ml': case 'mr': matchTap(ex, b.dataset.act==='ml'?'l':'r', k, b); break;
    case 'check': check(); break;
    case 'skip': resolve(ex,false); break;
    case 'next': next(); break;
  }
});
function matchTap(ex, side, id, el){
  if(side==='r') say(txt(ITEM[id]));
  if(!ex.pick || ex.pick.side===side){ ex.pick={side,id}; sfx('tap'); render(); return; }
  if(ex.pick.id===id){ ex.done.add(id); ex.pick=null; sfx('good');
    if(ex.done.size===ex.set.length){ render(); setTimeout(()=>resolve(ex,true),350); return; }
    render(); return; }
  ex.miss++; sfx('bad');
  const other = $app.querySelector(`[data-act=${ex.pick.side==='l'?'ml':'mr'}][data-k="${ex.pick.id}"]`);
  [el,other].forEach(n=>n&&n.classList.add('badx','shake'));
  ex.pick=null; setTimeout(render,450);
}
document.addEventListener('keydown', e=>{
  const v=view; if(v.name!=='session') return;
  if(e.key==='Escape') return quit();
  if(v.phase==='learn'){
    if(e.key===' '){e.preventDefault(); say(txt(v.items[v.li]));}
    if(e.key==='ArrowRight'||e.key==='Enter') $foot.querySelector('[data-act=nextcard]')?.click();
    if(e.key==='ArrowLeft') $foot.querySelector('[data-act=prev]')?.click();
    return;
  }
  if(v.phase==='done'){ if(e.key==='Enter') quit(); return; }
  const ex=curEx(); if(!ex) return;
  if(e.key==='Enter'){ e.preventDefault(); if(ex.state==='ask'){ if(canCheck(ex)) check(); } else next(); return; }
  if(e.target.tagName==='INPUT') return;
  if((ex.type==='picture'||ex.type==='phrase') && ex.state==='ask' && /^[1-4]$/.test(e.key)){ ex.sel=ex.opts[+e.key-1].id; sfx('tap'); if(ex.type==='phrase') say(txt(ITEM[ex.sel])); render(); }
  if(ex.type==='build' && e.key==='Backspace' && ex.state==='ask'){ ex.ans.pop(); render(); }
});

/* ---------- Android app mode (Material Design 3) ----------
   In the app Pesu gets three destinations (Scenes, Super Memory, Languages) and lessons open as a full-screen task
   at #/session, so the phone's Back and the app bar arrow leave a lesson. In a browser m3 is a stub and nothing changes. */
const m3 = window.KolamM3 ? KolamM3.init({
  primary:'#d9502f', title:'Pesu',
  destinations:[
    {id:'home', label:'Scenes', icon:'school', href:'#/'},
    {id:'review', label:'Review', icon:'psychology', href:'#/review'},
    {id:'languages', label:'Languages', icon:'translate', href:'#/languages'},
  ],
  onBack:()=>{ if($layer.innerHTML){ closeLayer(); return true; } },
}) : {enabled:false};
function renderReviewPage(){
  const due=dueItems().length, totalL=THEMES.reduce((a,t)=>a+learned(t),0), totalM=THEMES.reduce((a,t)=>a+mastered(t),0);
  $app.innerHTML=`<div class="hero"><h1 class="h-display">Super Memory</h1><p>Phrases you learn come back after 10 minutes, then 1, 3, 7 and 21 days, so they stick.</p></div>
  <div class="mstats">
    <div class="mstat"><b>${due}</b><span>due to refresh</span></div>
    <div class="mstat"><b>${S.streak}</b><span>day streak</span></div>
    <div class="mstat"><b>${totalL}</b><span>phrases learned</span></div>
    <div class="mstat"><b>${totalM}</b><span>mastered</span></div>
    <div class="mstat"><b>${S.today.xp} / ${GOAL}</b><span>XP today</span></div>
    <div class="mstat"><b>${S.xp}</b><span>XP total</span></div>
  </div>
  ${totalL?`<button class="memory ${due?'':'calm'}" data-act="review" style="width:100%;text-align:left"><span><h3>${due?`${due} phrase${due>1?'s':''} to refresh`:'Super Memory is up to date'}</h3>
    <p>${due?'Quick review before they fade.':'Practise your weakest phrases anyway?'}</p></span><span class="go">${due?'Review':'Practise'}</span></button>`
    :`<p class="note">Learn a scene first. The phrases you meet there show up here for review.</p>`}`;
}
function renderLangPage(){
  $app.innerHTML=`<div class="hero"><h1 class="h-display">Languages</h1><p>Progress is kept separately for each one.</p></div>
  <div class="langs">${Object.entries(LANGS).map(([k,l])=>{const n=Object.keys(S.srs[k]||{}).length;return `
    <button class="lang ${k===S.lang?'on':''}" data-act="pick" data-k="${k}"><span class="f">${l.flag}</span><span><b>${l.name}</b><span>${esc(l.native)} · ${n?`${n} phrases learned`:'Not started'}</span></span></button>`}).join('')}</div>`;
}
function m3Route(){
  const h=location.hash||'#/';
  if(h==='#/session'){ if(view.name!=='session'){ history.replaceState(null,'','#/'); return m3Route(); } }
  else {
    if(view.name==='session'){ try{speechSynthesis.cancel()}catch(e){} try{rec?.abort?.()}catch(e){} }
    if(!S.lang) view={name:'onboard'};
    else view={name: h==='#/review'?'review': h==='#/languages'?'languages':'home'};
    render(); window.scrollTo(0,0);
  }
  m3Title();
}
function m3Title(){
  const v=view, full=v.name==='session'||v.name==='onboard';
  document.documentElement.classList.toggle('pesu-full', full);
  m3.setTitle(v.name==='session'?(v.theme?v.theme.name:'Super Memory review'):v.name==='review'?'Super Memory':v.name==='languages'?'Languages':v.name==='onboard'?'Pesu':`Pesu · ${L().name}`);
  if(v.name==='session') setTimeout(()=>m3.setBack('#/'));
}
if(m3.enabled){
  const _start=startLesson, _review=startReview;
  startLesson=id=>{ _start(id); if(location.hash!=='#/session') location.hash='#/session'; else m3Title(); };
  startReview=()=>{ _review(); if(view.name==='session'){ if(location.hash!=='#/session') location.hash='#/session'; else m3Title(); } };
  addEventListener('hashchange', m3Route);
  m3Route();
} else render();
if('serviceWorker' in navigator && location.protocol==='https:') addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
